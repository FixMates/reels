version: '3.8'

services:
  studio:
    build: .
    container_name: ai-video-studio
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persistent SQLite DB, exported MP4s, uploaded PDFs, and audio
      - studio-data:/app/backend/storage
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  studio-data:
    driver: local
